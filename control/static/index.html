<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capita control</title>
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(18, 22, 32, 0.92);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #ffd34d;
    --error: #ff7a6b;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 18px; }
  h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  h1 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
  #leader { margin-top: 8px; font-size: 13px; }
  td .tile { color: var(--muted); margin-left: 6px; font-size: 12px; }
  #nation { width: 100%; padding: 9px 10px; border: 1px solid var(--panel-border); border-radius: 8px; background: #12161f; color: var(--text); font: inherit; font-size: 15px; }
  #turn { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #phase { color: var(--muted); margin: 2px 0 18px; }
  #phase.resolving { color: var(--accent); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  #orders { margin-bottom: 14px; }
  #orders ol { margin: 0; padding-left: 22px; }
  #orders li { padding: 3px 0; }
  #orders li .tile { color: var(--muted); margin-left: 6px; font-size: 12px; }
  #orders li button { margin-left: 8px; }
  #commit { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #000; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  #commit:disabled { opacity: 0.45; cursor: default; }
  #message { margin-top: 12px; min-height: 1.45em; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  #message.error { color: var(--error); }
  .none { color: var(--muted); }
  .summary { margin: 0 0 12px; color: var(--muted); }
  .summary b { color: var(--text); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { padding: 5px 8px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--panel-border); }
  tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.025); }
  tfoot td { border-top: 1px solid var(--panel-border); font-weight: 600; }
  .bar { display: inline-block; width: 46px; height: 6px; margin-left: 6px; vertical-align: middle; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar.short i { background: var(--error); }
  td.short { color: var(--error); }
  .summary .short { color: var(--error); }
  #leaders td { vertical-align: top; }
  #leaders td.command { white-space: normal; text-align: left; }
  #leaders th.command { text-align: left; }
  #leaders .root { color: var(--accent); font-size: 11px; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  button.small { padding: 3px 10px; border: 1px solid var(--panel-border); border-radius: 6px; background: #1b2130; color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  button.small:hover:not(:disabled) { border-color: var(--accent); }
  button.small:disabled { opacity: 0.4; cursor: default; }
  button.small.on { background: var(--accent); color: #000; border-color: var(--accent); }
  tr.moves td { background: rgba(255, 211, 77, 0.04); white-space: normal; text-align: left; }
  .options { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; margin: 4px 0; }
  .options button { text-align: left; padding: 6px 9px; line-height: 1.35; }
  .options .dir { font-weight: 600; display: inline-block; min-width: 2.2em; }
  .options .about { color: var(--muted); display: block; font-size: 11px; }
</style>
</head>
<body>
<main>
  <div class="panel">
    <h1>Playing as</h1>
    <select id="nation"><option value="">Choose a nation…</option></select>
    <div id="leader" class="none"></div>
  </div>
  <div class="panel">
    <h1>Control</h1>
    <div id="turn">Turn …</div>
    <div id="phase"></div>
    <h2>Orders this turn</h2>
    <div id="orders" class="none">Choose a nation to give orders.</div>
    <button id="commit" disabled>Commit Turn</button>
    <div id="message"></div>
  </div>
  <div class="panel">
    <h1>Leaders <small id="leadersNote"></small></h1>
    <div id="leaders"><div class="none">Choose a nation to see its leaders.</div></div>
  </div>
  <div class="panel">
    <h1>Production and consumption <small id="productionWhen"></small></h1>
    <div id="production"><div class="none">Choose a nation to see what its segments produce.</div></div>
  </div>
  <div class="panel">
    <h1>Deaths <small id="deathsWhen"></small></h1>
    <div id="deaths"><div class="none">Choose a nation to see its deaths.</div></div>
  </div>
</main>
<script>
  const turnEl = document.getElementById("turn");
  const phaseEl = document.getElementById("phase");
  // The phases of a turn: it accepts commands, then the engine resolves them into the next turn.
  const PHASES = { orders: "Accepting commands", resolving: "Resolving: commands closed, the engine is computing the next turn…" };
  const button = document.getElementById("commit");
  const message = document.getElementById("message");
  const nationSelect = document.getElementById("nation");
  const leaderEl = document.getElementById("leader");
  let committing = false, lastStatus = { turn: null, phase: null };
  let nations = [], nationId = null, shownTurn = null;   // the controlled nation; the turn the panels show
  const CHOOSE_HINT = "Choose the nation you're playing to issue commands.";

  function show(text, isError = false) {
    message.textContent = text;
    message.classList.toggle("error", isError);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  }

  function render(status) {
    lastStatus = status;
    turnEl.textContent = status.turn === null ? "No game state" : `Turn ${status.turn}`;
    phaseEl.textContent = PHASES[status.phase] ?? "";
    phaseEl.classList.toggle("resolving", status.phase === "resolving");
    // Commands, and so commits, need a nation to issue them for.
    button.disabled = committing || status.phase !== "orders" || nationId === null;
    if (status.turn === null && !committing) show("Run: python engine/engine.py init", true);
    else if (nationId === null && !committing && !message.classList.contains("error")) show(CHOOSE_HINT);
    if (status.turn !== null && status.turn !== shownTurn) {
      shownTurn = status.turn;
      loadNations().then(loadReports);
    } else if (status.phase !== leadersPhase) renderLeaders();   // commands open or close
  }

  async function poll() {
    try {
      const r = await fetch("/api/status");
      render(await r.json());
    } catch {
      turnEl.textContent = "Server offline";
      button.disabled = true;
    }
  }

  button.addEventListener("click", async () => {
    committing = true;
    button.disabled = true;
    show("");
    render({ ...lastStatus, phase: "resolving" });   // commands close as soon as the player commits
    try {
      // Naming the turn keeps a commit made elsewhere in the meantime from advancing the next one too.
      const r = await fetch("/api/commit", { method: "POST", headers: { "Content-Type": "application/json" },
                                             body: JSON.stringify({ turn: lastStatus.turn }) });
      const body = await r.json();
      if (r.ok) show(`Committed. Now turn ${body.turn}.`);
      else show(body.output ? `${body.error}\n${body.output}` : body.error, true);
    } catch {
      show("Couldn't reach the control server.", true);
    }
    committing = false;
    poll();
  });

  // ---------- choosing a nation ----------
  // The choice comes from ?nation=CODE in the URL, else the last one this browser chose. Changing it
  // updates both, so a URL can be bookmarked or opened in another tab for a different nation.
  function savedCode() {
    const fromUrl = new URLSearchParams(location.search).get("nation");
    if (fromUrl) return fromUrl.toUpperCase();
    try { return localStorage.getItem("capita.nation"); } catch { return null; }
  }

  function choose(code) {
    const n = nations.find(n => n.code === code && n.alive);
    nationId = n ? n.id : null;
    nationSelect.value = n ? n.code : "";
    leaderEl.textContent = n && n.leader ? `You lead as ${n.leader.name}.` : "";
    const url = new URL(location.href);
    if (n) url.searchParams.set("nation", n.code); else url.searchParams.delete("nation");
    history.replaceState(null, "", url);
    try { if (n) localStorage.setItem("capita.nation", n.code); } catch {}
    if (message.textContent === CHOOSE_HINT) show("");
    render(lastStatus);
  }

  async function loadNations() {
    try {
      nations = (await (await fetch("/api/nations")).json()).nations;
    } catch { return; }
    const keep = nationSelect.value || savedCode();
    nationSelect.innerHTML = '<option value="">Choose a nation…</option>' + nations.filter(n => n.alive)
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(n => `<option value="${esc(n.code)}">${esc(n.name)} (${esc(n.code)})</option>`).join("");
    choose(keep);
  }

  nationSelect.addEventListener("change", () => { choose(nationSelect.value); loadReports(); });
  function loadReports() { loadLeaders(); loadProduction(); loadDeaths(); }

  // ---------- leaders and their commands ----------
  // The nation's leaders, root (the player) first. Each can be told to move their segment to a
  // neighbouring tile: "Move" lists the tiles it can go to, and choosing one saves the command as the
  // nation's orders for this turn. The engine carries it out when the turn is committed.
  const leadersEl = document.getElementById("leaders");
  const leadersNote = document.getElementById("leadersNote");
  const DIRS = { n: "N", ne: "NE", e: "E", se: "SE", s: "S", sw: "SW", w: "W", nw: "NW", on: "On", back: "Back" };
  let leaderList = null, leadersPhase = null, openMoves = null, moveOptions = null;   // openMoves: leader id

  async function loadLeaders() {
    if (nationId === null) {
      leaderList = null;
      renderOrders();
      leadersNote.textContent = "";
      leadersEl.innerHTML = '<div class="none">Choose a nation to see its leaders.</div>';
      return;
    }
    const id = nationId;
    let body;
    try {
      body = await (await fetch(`/api/nation/${id}/leaders`)).json();
    } catch { return; }
    if (id !== nationId || body.error) return;
    if (leaderList && leaderList.turn !== body.turn) openMoves = null;
    leaderList = body;
    renderLeaders();
  }

  const canOrder = () => lastStatus.phase === "orders" && !committing && leaderList && leaderList.turn === lastStatus.turn;

  function commandText(c) {
    if (!c) return '<span class="none">None</span>';
    if (c.type === "move") return `Move to ${esc(c.to)}`;
    if (c.type === "found_kingdom") return `Found a kingdom (${esc(c.title)})`;
    return esc(c.type);
  }

  // The nation's orders for this turn as a list, one per leader (a new command for a leader replaces
  // their old one), to review before committing.
  const ordersEl = document.getElementById("orders");
  function renderOrders() {
    if (!leaderList) {
      ordersEl.className = "none";
      ordersEl.textContent = nationId === null ? "Choose a nation to give orders." : "";
      return;
    }
    const given = leaderList.leaders.filter(l => l.command), open = canOrder();
    ordersEl.className = given.length ? "" : "none";
    if (!given.length) {
      ordersEl.textContent = "None yet. Use Move next to a leader below.";
      return;
    }
    ordersEl.innerHTML = `<ol>${given.map(l => `
      <li><b>${esc(l.name)}</b>: ${commandText(l.command).replace(/^Move/, "move")}<span class="tile">from ${esc(l.tile)}</span>
        <button class="small" data-cancel="${l.id}" ${open ? "" : "disabled"}>Cancel</button></li>`).join("")}</ol>`;
  }

  function renderLeaders() {
    leadersPhase = lastStatus.phase;
    renderOrders();
    if (!leaderList) return;
    const L = leaderList.leaders, open = canOrder();
    leadersNote.textContent = `(${L.length} leader${L.length === 1 ? "" : "s"}, turn ${leaderList.turn})`;
    if (!L.length) {
      leadersEl.innerHTML = `<div class="none">${esc(leaderList.nation.name)} has no leaders.</div>`;
      return;
    }
    const where = l => l.moving
      ? `${esc(l.tile)}<span class="tile">${esc(l.at)} → ${esc(l.toward)}, ${num(100 * l.progress)}%${
          l.destination !== l.toward ? `, then ${esc(l.destination)}` : ""}</span>`
      : esc(l.tile);
    leadersEl.innerHTML = `
      <div class="table-wrap"><table>
        <thead><tr><th>Leader</th><th>Type</th><th>Tile</th><th>People</th><th class="command">Command this turn</th><th></th></tr></thead>
        <tbody>${L.map(l => `
          <tr>
            <td>${esc(l.name)}${l.root ? '<span class="root">you</span>' : ""}</td>
            <td>${esc(l.type)}</td><td>${where(l)}</td><td>${num(l.people)}</td>
            <td class="command">${commandText(l.command)}
              ${l.command ? `<button class="small" data-cancel="${l.id}" ${open ? "" : "disabled"}>Cancel</button>` : ""}</td>
            <td><button class="small${openMoves === l.id ? " on" : ""}" data-move="${l.id}" ${open ? "" : "disabled"}>Move</button></td>
          </tr>
          ${openMoves === l.id ? `<tr class="moves"><td colspan="6">${movesHtml(l)}</td></tr>` : ""}`).join("")}
        </tbody>
      </table></div>`;
  }

  function movesHtml(l) {
    if (!moveOptions || moveOptions.leader.id !== l.id) return '<span class="none">Loading…</span>';
    const m = moveOptions;
    const intro = m.moving
      ? `${esc(l.name)} is ${num(100 * m.progress)}% of the way from ${esc(m.from)} to ${esc(m.toward)}. They will
         finish that step or walk back, whichever makes the way shorter. Move to:`
      : `Move ${esc(l.name)} from ${esc(m.from)} to:`;
    return `${intro}<div class="options">${m.options.map(o => {
      const about = [m.moving ? `${num(o.km)} km${o.via ? ` via ${o.via}` : ""}` : null, `${o.land}% land`, o.cover, o.river ? "river" : null, o.owner ? `owned by ${o.owner}` : null,
                     o.people > 0 ? `${num(o.people)} people` : null].filter(Boolean).join(", ");
      const chosen = l.command && l.command.type === "move" && l.command.to === o.tile;
      return `<button class="small${chosen ? " on" : ""}" data-to="${esc(o.tile)}" data-leader="${l.id}"
        ${o.walkable ? "" : 'disabled title="All water: crossing it will need boats"'}>
        <span class="dir">${DIRS[o.direction] ?? esc(o.direction)}</span> ${esc(o.tile)}<span class="about">${esc(about)}</span></button>`;
    }).join("")}</div>`;
  }

  async function giveOrder(leader, command) {
    const l = leaderList.leaders.find(l => l.id === leader);
    const old = l.command && l.command.type === "move" ? l.command.to : null;
    try {
      const r = await fetch(`/api/nation/${nationId}/orders`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ turn: leaderList.turn, leader, command }),
      });
      const body = await r.json();
      if (!r.ok) { show(body.error, true); return; }
      show(command ? `Saved: ${l.name} will move to ${command.to} when the turn is committed${
                       old && old !== command.to ? ` (replacing the order to move to ${old})` : ""}.`
                   : `Cancelled ${l.name}'s order.`);
    } catch {
      show("Couldn't reach the control server.", true);
      return;
    }
    openMoves = null;
    await loadLeaders();
  }

  ordersEl.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b && !b.disabled && b.dataset.cancel) giveOrder(Number(b.dataset.cancel), null);
  });

  leadersEl.addEventListener("click", async e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    if (b.dataset.move) {
      const id = Number(b.dataset.move);
      if (openMoves === id) { openMoves = null; renderLeaders(); return; }
      openMoves = id;
      moveOptions = null;
      renderLeaders();
      try {
        const body = await (await fetch(`/api/leader/${id}/moves`)).json();
        if (openMoves === id && !body.error) { moveOptions = body; renderLeaders(); }
      } catch {}
    } else if (b.dataset.to) {
      giveOrder(Number(b.dataset.leader), { type: "move", to: b.dataset.to });
    } else if (b.dataset.cancel) {
      giveOrder(Number(b.dataset.cancel), null);
    }
  });

  // ---------- production and consumption ----------
  // What each of the nation's segments (the people directly under one leader) made and consumed in the
  // year that ended with the current turn. The engine computes it while resolving the previous turn, so
  // turn 0 has none. When a segment holds less than its people need, everyone's consumption is cut by
  // the same share ("need met"). Segments on the same tile share its maximum.
  const productionEl = document.getElementById("production");
  const whenEl = document.getElementById("productionWhen");
  const num = (x, digits = 0) => x.toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: digits });
  function big(x) {   // 268,123,456 -> "268.1M"
    const a = Math.abs(x);
    return a >= 1e9 ? `${num(x / 1e9, 2)}B` : a >= 1e6 ? `${num(x / 1e6, 1)}M` : a >= 1e3 ? `${num(x / 1e3, 1)}k` : num(x);
  }

  async function loadProduction() {
    if (nationId === null) {
      whenEl.textContent = "";
      productionEl.innerHTML = '<div class="none">Choose a nation to see what its segments produce.</div>';
      return;
    }
    const id = nationId;
    let body;
    try {
      body = await (await fetch(`/api/nation/${id}/production`)).json();
    } catch { return; }
    if (id !== nationId || body.error) return;   // the choice changed while loading
    whenEl.textContent = body.turn > 0 ? `(the year that ended with turn ${body.turn})` : "";
    if (body.turn === 0) {
      productionEl.innerHTML = '<div class="none">Nothing yet. Each turn shows what was made in the year before it, so the first figures appear after the first commit.</div>';
      return;
    }
    if (!body.segment_count) {
      productionEl.innerHTML = `<div class="none">${esc(body.nation.name)} has no segments.</div>`;
      return;
    }
    productionEl.innerHTML = body.products.map((p, k) => productTable(body, p, k)).join("");
  }

  function productTable(body, p, k) {
    const t = body.totals;
    const perDay = (made, people) => people > 0 ? num(made / people / 365) : "–";
    const consumed = t.need[k] > 0;   // products nobody consumes get no need columns
    const pct = (s, short = false) =>
      `${num(100 * s)}%<span class="bar${short ? " short" : ""}"><i style="width:${(100 * Math.min(s, 1)).toFixed(1)}%"></i></span>`;
    const met = (ate, need) => need > 0 ? ate / need : 1;
    const row = (label, r) => {
      const s = met(r.consumed[k], r.need[k]), short = s < 1 - 1e-9;
      return `<tr>
        <td>${label}</td><td>${num(r.people)}</td><td>${big(r.labor_hours[k])}</td>
        <td title="${num(r.produced[k])} ${esc(p.unit)}">${big(r.produced[k])}</td><td>${perDay(r.produced[k], r.people)}</td>
        <td>${pct(r.max[k] > 0 ? r.produced[k] / r.max[k] : 0)}</td>
        ${consumed ? `<td title="${num(r.need[k])} ${esc(p.unit)}">${big(r.need[k])}</td>
        <td class="${short ? "short" : ""}" title="consumed ${num(r.consumed[k])} ${esc(p.unit)}">${pct(s, short)}</td>` : ""}</tr>`;
    };
    const n = body.segment_count, plural = (x, word) => `${num(x)} ${word}${x === 1 ? "" : "s"}`;
    const shown = body.segments.length < n ? ` Showing the ${body.segments.length} most productive of ${num(n)} segments.` : "";
    const shortSegs = t.short_segments[k];
    const eaten = consumed ? ` Consumed <b>${big(t.consumed[k])}</b>: ${num(100 * met(t.consumed[k], t.need[k]), 1)}% of need${
      shortSegs ? `, <span class="short">${plural(shortSegs, "segment")} short</span>` : ", no segment short"}.` : "";
    return `
      <p class="summary">Made <b>${big(t.produced[k])} ${esc(p.unit)}</b> of ${esc(p.name)} in
        <b>${plural(n, "segment")}</b> on ${plural(body.tile_count, "tile")}
        (${perDay(t.produced[k], t.people)} ${esc(p.unit)} per person per day).${eaten}${shown}
        The nation owns ${plural(body.owned_tiles, "tile")}.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Segment</th><th>People</th><th>Labor (h)</th><th>Made (${esc(p.unit)})</th>
          <th>${esc(p.unit)} / person / day</th><th>Of tile's max</th>
          ${consumed ? `<th>Needed (${esc(p.unit)})</th><th>Need met</th>` : ""}</tr></thead>
        <tbody>${body.segments.map(r => row(segLabel(r), r)).join("")}</tbody>
        <tfoot>${row("Total", { people: t.people, labor_hours: t.labor_hours, produced: t.produced, max: t.max,
                                need: t.need, consumed: t.consumed })}</tfoot>
      </table></div>`;
  }

  // A segment as its leader's name and the tile it counts as being in.
  const segLabel = r => `${esc(r.name)}<span class="tile">${esc(r.tile)}${r.moving ? " · moving" : ""}</span>`;

  // ---------- deaths ----------
  // How many people died of each cause in each of the nation's segments in the year that ended with the
  // current turn. People die in fractions, so small numbers are shown with a decimal.
  const deathsEl = document.getElementById("deaths");
  const deathsWhenEl = document.getElementById("deathsWhen");
  const causeLabel = c => c.replace(/_/g, " ").replace(/^./, s => s.toUpperCase());
  const few = x => x >= 100 ? big(x) : num(x, 1);

  async function loadDeaths() {
    if (nationId === null) {
      deathsWhenEl.textContent = "";
      deathsEl.innerHTML = '<div class="none">Choose a nation to see its deaths.</div>';
      return;
    }
    const id = nationId;
    let body;
    try {
      body = await (await fetch(`/api/nation/${id}/deaths`)).json();
    } catch { return; }
    if (id !== nationId || body.error) return;
    deathsWhenEl.textContent = body.turn > 0 ? `(the year that ended with turn ${body.turn})` : "";
    if (body.turn === 0) {
      deathsEl.innerHTML = '<div class="none">Nothing yet: the first figures appear after the first commit.</div>';
      return;
    }
    if (!body.segment_count) {
      deathsEl.innerHTML = `<div class="none">${esc(body.nation.name)} has no segments.</div>`;
      return;
    }
    const t = body.totals, sum = a => a.reduce((x, y) => x + y, 0);
    const died = sum(t.deaths);
    const perK = (d, p) => p + d > 0 ? num(1000 * d / (p + d), 1) : "–";   // per 1,000 alive during the year, roughly
    const row = (label, r) => `<tr><td>${label}</td><td>${num(r.people)}</td><td>${few(sum(r.deaths))}</td>
      <td>${perK(sum(r.deaths), r.people)}</td>${r.deaths.map(d => `<td>${few(d)}</td>`).join("")}</tr>`;
    const causes = body.causes.map((c, k) => [c, t.deaths[k]]).sort((a, b) => b[1] - a[1])
      .map(([c, d]) => `${esc(causeLabel(c).toLowerCase())} ${few(d)}`).join(", ");
    const shown = body.segments.length < body.segment_count
      ? ` Showing the ${body.segments.length} segments with the most deaths of ${num(body.segment_count)}.` : "";
    deathsEl.innerHTML = `
      <p class="summary"><b>${few(died)}</b> died (${perK(died, t.people)} per 1,000): ${causes}.${shown}</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Segment</th><th>People now</th><th>Died</th><th>Per 1,000</th>
          ${body.causes.map(c => `<th>${esc(causeLabel(c))}</th>`).join("")}</tr></thead>
        <tbody>${body.segments.map(r => row(segLabel(r), r)).join("")}</tbody>
        <tfoot>${row("Total", { people: t.people, deaths: t.deaths })}</tfoot>
      </table></div>`;
  }

  poll();
  setInterval(poll, 1000);   // picks up turns advanced elsewhere, such as engine.py step from a terminal
</script>
</body>
</html>
