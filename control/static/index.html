<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capita control</title>
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(18, 22, 32, 0.92);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #ffd34d;
    --error: #ff7a6b;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 18px; }
  h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  h1 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
  #nation { width: 100%; padding: 9px 10px; border: 1px solid var(--panel-border); border-radius: 8px; background: #12161f; color: var(--text); font: inherit; font-size: 15px; }
  #turn { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #phase { color: var(--muted); margin: 2px 0 18px; }
  #phase.resolving { color: var(--accent); }
  #commit { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #000; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  #commit:disabled { opacity: 0.45; cursor: default; }
  #message { margin-top: 12px; min-height: 1.45em; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  #message.error { color: var(--error); }
  .none { color: var(--muted); }
  .summary { margin: 0 0 12px; color: var(--muted); }
  .summary b { color: var(--text); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { padding: 5px 8px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--panel-border); }
  tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.025); }
  tfoot td { border-top: 1px solid var(--panel-border); font-weight: 600; }
  .bar { display: inline-block; width: 46px; height: 6px; margin-left: 6px; vertical-align: middle; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar.short i { background: var(--error); }
  td.short { color: var(--error); }
  .summary .short { color: var(--error); }
</style>
</head>
<body>
<main>
  <div class="panel">
    <h1>Playing as</h1>
    <select id="nation"><option value="">Choose a nation…</option></select>
  </div>
  <div class="panel">
    <h1>Control</h1>
    <div id="turn">Turn …</div>
    <div id="phase"></div>
    <button id="commit" disabled>Commit Turn</button>
    <div id="message"></div>
  </div>
  <div class="panel">
    <h1>Production and consumption <small id="productionWhen"></small></h1>
    <div id="production"><div class="none">Choose a nation to see what its tiles produce.</div></div>
  </div>
  <div class="panel">
    <h1>Deaths <small id="deathsWhen"></small></h1>
    <div id="deaths"><div class="none">Choose a nation to see its deaths.</div></div>
  </div>
</main>
<script>
  const turnEl = document.getElementById("turn");
  const phaseEl = document.getElementById("phase");
  // The phases of a turn: it accepts commands, then the engine resolves them into the next turn.
  const PHASES = { orders: "Accepting commands", resolving: "Resolving: commands closed, the engine is computing the next turn…" };
  const button = document.getElementById("commit");
  const message = document.getElementById("message");
  const nationSelect = document.getElementById("nation");
  let committing = false, lastStatus = { turn: null, phase: null };
  let nations = [], nationId = null, shownTurn = null;   // the controlled nation; the turn the panels show
  const CHOOSE_HINT = "Choose the nation you're playing to issue commands.";

  function show(text, isError = false) {
    message.textContent = text;
    message.classList.toggle("error", isError);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  }

  function render(status) {
    lastStatus = status;
    turnEl.textContent = status.turn === null ? "No game state" : `Turn ${status.turn}`;
    phaseEl.textContent = PHASES[status.phase] ?? "";
    phaseEl.classList.toggle("resolving", status.phase === "resolving");
    // Commands, and so commits, need a nation to issue them for.
    button.disabled = committing || status.phase !== "orders" || nationId === null;
    if (status.turn === null && !committing) show("Run: python engine/engine.py init", true);
    else if (nationId === null && !committing && !message.classList.contains("error")) show(CHOOSE_HINT);
    if (status.turn !== null && status.turn !== shownTurn) {
      shownTurn = status.turn;
      loadNations().then(loadReports);
    }
  }

  async function poll() {
    try {
      const r = await fetch("/api/status");
      render(await r.json());
    } catch {
      turnEl.textContent = "Server offline";
      button.disabled = true;
    }
  }

  button.addEventListener("click", async () => {
    committing = true;
    button.disabled = true;
    show("");
    render({ ...lastStatus, phase: "resolving" });   // commands close as soon as the player commits
    try {
      const r = await fetch("/api/commit", { method: "POST" });
      const body = await r.json();
      if (r.ok) show(`Committed. Now turn ${body.turn}.`);
      else show(body.output ? `${body.error}\n${body.output}` : body.error, true);
    } catch {
      show("Couldn't reach the control server.", true);
    }
    committing = false;
    poll();
  });

  // ---------- choosing a nation ----------
  // The choice comes from ?nation=CODE in the URL, else the last one this browser chose. Changing it
  // updates both, so a URL can be bookmarked or opened in another tab for a different nation.
  function savedCode() {
    const fromUrl = new URLSearchParams(location.search).get("nation");
    if (fromUrl) return fromUrl.toUpperCase();
    try { return localStorage.getItem("capita.nation"); } catch { return null; }
  }

  function choose(code) {
    const n = nations.find(n => n.code === code && n.alive);
    nationId = n ? n.id : null;
    nationSelect.value = n ? n.code : "";
    const url = new URL(location.href);
    if (n) url.searchParams.set("nation", n.code); else url.searchParams.delete("nation");
    history.replaceState(null, "", url);
    try { if (n) localStorage.setItem("capita.nation", n.code); } catch {}
    if (message.textContent === CHOOSE_HINT) show("");
    render(lastStatus);
  }

  async function loadNations() {
    try {
      nations = (await (await fetch("/api/nations")).json()).nations;
    } catch { return; }
    const keep = nationSelect.value || savedCode();
    nationSelect.innerHTML = '<option value="">Choose a nation…</option>' + nations.filter(n => n.alive)
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(n => `<option value="${esc(n.code)}">${esc(n.name)} (${esc(n.code)})</option>`).join("");
    choose(keep);
  }

  nationSelect.addEventListener("change", () => { choose(nationSelect.value); loadReports(); });
  function loadReports() { loadProduction(); loadDeaths(); }

  // ---------- production and consumption ----------
  // What each tile the nation owns made and consumed in the year that ended with the current turn. The
  // engine computes it while resolving the previous turn, so turn 0 has none. When a tile holds less
  // than its people need, everyone's consumption is cut by the same share ("need met").
  const productionEl = document.getElementById("production");
  const whenEl = document.getElementById("productionWhen");
  const num = (x, digits = 0) => x.toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: digits });
  function big(x) {   // 268,123,456 -> "268.1M"
    const a = Math.abs(x);
    return a >= 1e9 ? `${num(x / 1e9, 2)}B` : a >= 1e6 ? `${num(x / 1e6, 1)}M` : a >= 1e3 ? `${num(x / 1e3, 1)}k` : num(x);
  }

  async function loadProduction() {
    if (nationId === null) {
      whenEl.textContent = "";
      productionEl.innerHTML = '<div class="none">Choose a nation to see what its tiles produce.</div>';
      return;
    }
    const id = nationId;
    let body;
    try {
      body = await (await fetch(`/api/nation/${id}/production`)).json();
    } catch { return; }
    if (id !== nationId || body.error) return;   // the choice changed while loading
    whenEl.textContent = body.turn > 0 ? `(the year that ended with turn ${body.turn})` : "";
    if (body.turn === 0) {
      productionEl.innerHTML = '<div class="none">Nothing yet. Each turn shows what was made in the year before it, so the first figures appear after the first commit.</div>';
      return;
    }
    if (!body.populated_tiles) {
      productionEl.innerHTML = `<div class="none">${esc(body.nation.name)} has no populated tiles.</div>`;
      return;
    }
    productionEl.innerHTML = body.products.map((p, k) => productTable(body, p, k)).join("");
  }

  function productTable(body, p, k) {
    const t = body.totals;
    const perDay = (made, people) => people > 0 ? num(made / people / 365) : "–";
    const consumed = t.need[k] > 0;   // products nobody consumes get no need columns
    const pct = (s, short = false) =>
      `${num(100 * s)}%<span class="bar${short ? " short" : ""}"><i style="width:${(100 * Math.min(s, 1)).toFixed(1)}%"></i></span>`;
    const met = (ate, need) => need > 0 ? ate / need : 1;
    const row = (label, r) => {
      const s = met(r.consumed[k], r.need[k]), short = s < 1 - 1e-9;
      return `<tr>
        <td>${label}</td><td>${num(r.people)}</td><td>${big(r.labor_hours[k])}</td>
        <td title="${num(r.produced[k])} ${esc(p.unit)}">${big(r.produced[k])}</td><td>${perDay(r.produced[k], r.people)}</td>
        <td>${pct(r.max[k] > 0 ? r.produced[k] / r.max[k] : 0)}</td>
        ${consumed ? `<td title="${num(r.need[k])} ${esc(p.unit)}">${big(r.need[k])}</td>
        <td class="${short ? "short" : ""}" title="consumed ${num(r.consumed[k])} ${esc(p.unit)}">${pct(s, short)}</td>` : ""}</tr>`;
    };
    const shown = body.tiles.length < body.populated_tiles
      ? ` Showing the ${body.tiles.length} most productive of ${num(body.populated_tiles)} populated tiles.` : "";
    const empty = body.owned_tiles - body.populated_tiles;
    const shortTiles = t.short_tiles[k];
    const eaten = consumed ? ` Consumed <b>${big(t.consumed[k])}</b>: ${num(100 * met(t.consumed[k], t.need[k]), 1)}% of need${
      shortTiles ? `, <span class="short">${num(shortTiles)} tile${shortTiles === 1 ? "" : "s"} short</span>` : ", no tile short"}.` : "";
    return `
      <p class="summary">Made <b>${big(t.produced[k])} ${esc(p.unit)}</b> of ${esc(p.name)} on
        <b>${num(body.populated_tiles)}</b> populated tile${body.populated_tiles === 1 ? "" : "s"}
        (${perDay(t.produced[k], t.people)} ${esc(p.unit)} per person per day).${eaten}${shown}
        ${empty ? ` ${num(empty)} owned tile${empty === 1 ? " has" : "s have"} nobody living there.` : ""}</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Tile</th><th>People</th><th>Labor (h)</th><th>Made (${esc(p.unit)})</th>
          <th>${esc(p.unit)} / person / day</th><th>Of tile's max</th>
          ${consumed ? `<th>Needed (${esc(p.unit)})</th><th>Need met</th>` : ""}</tr></thead>
        <tbody>${body.tiles.map(r => row(esc(r.tile), r)).join("")}</tbody>
        <tfoot>${row("Total", { people: t.people, labor_hours: t.labor_hours, produced: t.produced, max: t.max,
                                need: t.need, consumed: t.consumed })}</tfoot>
      </table></div>`;
  }

  // ---------- deaths ----------
  // How many people died of each cause on each tile the nation owns in the year that ended with the
  // current turn. People die in fractions, so small numbers are shown with a decimal.
  const deathsEl = document.getElementById("deaths");
  const deathsWhenEl = document.getElementById("deathsWhen");
  const causeLabel = c => c.replace(/_/g, " ").replace(/^./, s => s.toUpperCase());
  const few = x => x >= 100 ? big(x) : num(x, 1);

  async function loadDeaths() {
    if (nationId === null) {
      deathsWhenEl.textContent = "";
      deathsEl.innerHTML = '<div class="none">Choose a nation to see its deaths.</div>';
      return;
    }
    const id = nationId;
    let body;
    try {
      body = await (await fetch(`/api/nation/${id}/deaths`)).json();
    } catch { return; }
    if (id !== nationId || body.error) return;
    deathsWhenEl.textContent = body.turn > 0 ? `(the year that ended with turn ${body.turn})` : "";
    if (body.turn === 0) {
      deathsEl.innerHTML = '<div class="none">Nothing yet: the first figures appear after the first commit.</div>';
      return;
    }
    if (!body.populated_tiles) {
      deathsEl.innerHTML = `<div class="none">${esc(body.nation.name)} has no populated tiles.</div>`;
      return;
    }
    const t = body.totals, sum = a => a.reduce((x, y) => x + y, 0);
    const died = sum(t.deaths);
    const perK = (d, p) => p + d > 0 ? num(1000 * d / (p + d), 1) : "–";   // per 1,000 alive during the year, roughly
    const row = (label, r) => `<tr><td>${label}</td><td>${num(r.people)}</td><td>${few(sum(r.deaths))}</td>
      <td>${perK(sum(r.deaths), r.people)}</td>${r.deaths.map(d => `<td>${few(d)}</td>`).join("")}</tr>`;
    const causes = body.causes.map((c, k) => [c, t.deaths[k]]).sort((a, b) => b[1] - a[1])
      .map(([c, d]) => `${esc(causeLabel(c).toLowerCase())} ${few(d)}`).join(", ");
    const shown = body.tiles.length < body.populated_tiles
      ? ` Showing the ${body.tiles.length} tiles with the most deaths of ${num(body.populated_tiles)}.` : "";
    deathsEl.innerHTML = `
      <p class="summary"><b>${few(died)}</b> died (${perK(died, t.people)} per 1,000): ${causes}.${shown}</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Tile</th><th>People now</th><th>Died</th><th>Per 1,000</th>
          ${body.causes.map(c => `<th>${esc(causeLabel(c))}</th>`).join("")}</tr></thead>
        <tbody>${body.tiles.map(r => row(esc(r.tile), r)).join("")}</tbody>
        <tfoot>${row("Total", { people: t.people, deaths: t.deaths })}</tfoot>
      </table></div>`;
  }

  poll();
  setInterval(poll, 1000);   // picks up turns advanced elsewhere, such as engine.py step from a terminal
</script>
</body>
</html>
