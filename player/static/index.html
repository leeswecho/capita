<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capita</title>
<style>
  /* Everything that changes with the era (the surfaces, their edges, the ink) is a variable here;
     applyEra() sets them. The stone age has rough stone, generated by stoneTexture(). */
  :root {
    --surface: #8d877c;           /* replaced by the era's texture */
    --surface-color: #8d877c;
    --hi: #c9c3b6;                /* lit edge of a raised surface */
    --lo: #3e3a33;                /* shadowed edge */
    --ink: #17140f;
    --ink-soft: #3b362d;
    --pressed: #6f6a60;
    --font: Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font: 15px/1.4 var(--font); }
  [hidden] { display: none !important; }

  .stone { background: var(--surface-color) var(--surface); border: 3px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
  .btn { background: var(--surface-color) var(--surface); color: var(--ink); font: inherit; border: 2px solid;
         border-color: var(--hi) var(--lo) var(--lo) var(--hi); padding: 5px 10px; cursor: pointer; text-align: left; }
  .btn:hover:not(:disabled) { filter: brightness(1.1); }
  .btn:active:not(:disabled), .btn.on { border-color: var(--lo) var(--hi) var(--hi) var(--lo); background-color: var(--pressed); }
  .btn:disabled { color: var(--ink-soft); opacity: 0.55; cursor: default; }
  #nationList, #tile { scrollbar-color: var(--lo) transparent; }
  .hole { background: rgba(0, 0, 0, 0.18); border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }

  /* ---------- choosing a nation ---------- */
  #choose { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
  #chooseBox { width: min(360px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  #chooseBox h1 { margin: 0; font-size: 18px; font-weight: bold; }
  #nationList { height: min(300px, 45vh); overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 3px; }
  #nationList .btn { width: 100%; display: flex; align-items: center; gap: 8px; }
  #nationList .flag { height: 18px; }
  /* A nation is shown by its flag wherever the page would otherwise print its name; hovering shows the name. */
  .flag { height: 0.9em; aspect-ratio: 4 / 3; vertical-align: -0.05em; border: 1px solid rgba(0, 0, 0, 0.55); }
  #chooseBox label { display: flex; flex-direction: column; gap: 4px; }
  #nationName { font: inherit; color: var(--ink); padding: 5px 7px; background: rgba(255, 255, 255, 0.35);
                border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); outline: none; }
  #begin { align-self: flex-end; padding: 6px 22px; }

  /* ---------- the game ---------- */
  #game { position: fixed; inset: 0; display: flex; }
  #side { width: 250px; flex: none; display: flex; flex-direction: column; padding: 12px; gap: 12px; }
  #tile { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  #terrain { padding: 6px 8px; min-height: 2.6em; display: flex; flex-direction: column; gap: 5px; }
  #terrain .types { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; }
  .ticon { display: inline-block; width: 24px; height: 24px; border: 1px solid rgba(0, 0, 0, 0.6); }
  .ticon svg { display: block; width: 100%; height: 100%; }
  /* A landform or cover's icon is smaller the less of the tile it covers: a quarter to a half, less. */
  .ticon.size1 { width: 19px; height: 19px; }
  .ticon.size2 { width: 14px; height: 14px; }
  #place { padding: 5px 8px; font-size: 14px; cursor: text; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #place:empty { display: none; }
  #place.unnamed { font-style: italic; color: var(--ink-soft); }
  #place input { width: 100%; font: inherit; font-style: normal; color: var(--ink); padding: 0 2px; margin: -1px 0;
                 background: rgba(255, 255, 255, 0.35); border: 0; outline: none; }
  #segments { display: flex; flex-direction: column; gap: 5px; }
  .seg.shown { outline: 2px solid var(--ink); outline-offset: -5px; }
  #info { padding: 6px 8px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
  #info:empty { display: none; }
  #info .title { font-weight: bold; }
  #info p { margin: 0; }
  #info .counts { display: flex; flex-wrap: wrap; column-gap: 14px; }
  .seg { width: 100%; }
  .seg .people { display: flex; align-items: center; gap: 3px; font-size: 13px; }
  .glyph { display: inline-block; width: 1em; height: 1em; vertical-align: -0.12em; }
  .glyph svg { display: block; width: 100%; height: 100%; }
  .seg .order { display: block; font-size: 13px; font-style: italic; }
  /* Two small boxes over the map: the nation's orders this turn (top left, only when there are any)
     and the turn with Commit Turn (bottom left). The side bar is only about the chosen tile. */
  #ordersBox { position: absolute; top: 10px; left: 10px; z-index: 2; width: 210px; max-height: 30%; overflow-y: auto;
               padding: 6px 8px; font-size: 13px; scrollbar-color: var(--lo) transparent; }
  #ordersBox .head { font-weight: bold; margin-bottom: 3px; }
  #ordersBox .row { display: flex; align-items: center; gap: 4px; }
  #ordersBox .row + .row { margin-top: 3px; }
  #ordersBox .who { flex: 1; min-width: 0; background: none; border: 0; padding: 1px 0; font: inherit; color: var(--ink);
                    text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ordersBox .who:hover { text-decoration: underline; }
  #ordersBox .x { padding: 0 5px; font-size: 12px; line-height: 1.3; text-align: center; }
  #turnBox { position: absolute; left: 10px; bottom: 10px; z-index: 2; width: 180px; padding: 8px;
             display: flex; flex-direction: column; gap: 6px; }
  #turnLine { font-size: 13px; }
  #commit { display: flex; justify-content: center; align-items: center; padding: 5px; }
  #commit .glyph { width: 26px; height: 26px; }
  #msg { font-size: 13px; }
  #msg:empty { display: none; }
  #view { position: relative; flex: 1; min-width: 0; background: #000; }
  #view canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #view canvas.dragging { cursor: grabbing; }

  /* A leader's menus open beside the leader. */
  #menu { position: fixed; z-index: 10; padding: 8px; min-width: 150px; max-width: 260px; display: flex; flex-direction: column; gap: 5px; }
  #menu .title { font-weight: bold; font-size: 14px; }
  #menu p { margin: 0; }
  #menu .btn { width: 100%; }
  .compass { display: grid; grid-template-columns: repeat(3, 44px); gap: 3px; justify-content: center; }
  .compass .btn { width: 44px; height: 34px; padding: 0; text-align: center; }
  .compass .here { display: grid; place-items: center; }
  #menu label { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
  #menu input { font: inherit; color: var(--ink); padding: 4px 6px; background: rgba(255, 255, 255, 0.35);
                border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); outline: none; }
  #menu .why { font-style: italic; }

  @media (max-width: 640px) {
    #game { flex-direction: column; }
    #side { width: 100%; height: 44%; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="choose">
  <div id="chooseBox" class="stone">
    <h1>Choose your people</h1>
    <div id="nationList" class="hole"></div>
    <label>Their name <input id="nationName" maxlength="40" spellcheck="false" disabled></label>
    <div id="chooseMsg"></div>
    <button id="begin" class="btn" disabled>Begin</button>
  </div>
</div>

<div id="game" hidden>
  <div id="view">
    <div id="ordersBox" class="stone" hidden></div>
    <div id="turnBox" class="stone">
      <div id="turnLine"></div>
      <button id="commit" class="btn" disabled title="Commit Turn" aria-label="Commit Turn"></button>
      <div id="msg"></div>
    </div>
  </div>
  <aside id="side" class="stone">
    <div id="tile">
      <div id="terrain" class="hole"></div>
      <div id="place" class="hole"></div>
      <div id="segments"></div>
      <div id="info" class="hole"></div>
    </div>
  </aside>
</div>
<div id="menu" class="stone" hidden></div>

<script type="module">
import * as THREE from "three";
import { drawCamps } from "/camps.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function api(url, body) {
  const r = await fetch(url, body === undefined ? undefined
    : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `The server said ${r.status}.`);
  return data;
}
const store = {   // per-browser conveniences only; the page works without them
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---------- eras ----------
// The page's look follows the age the player's society has reached. Only the stone age exists so far;
// a later era adds an entry (its texture and colours) and the page switches when the state says so.
function stoneTexture(size = 256, seed = 20231) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(size, size);
  let s = seed;
  const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const octave = cells => {   // value noise that repeats every `size` pixels, so the texture tiles
    const g = Array.from({ length: cells * cells }, rand);
    const at = (i, j) => g[(j % cells) * cells + (i % cells)];
    return (x, y) => {
      const fx = x / size * cells, fy = y / size * cells, x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    };
  };
  const octaves = [[3, 0.4], [6, 0.25], [12, 0.15], [24, 0.12], [64, 0.08]].map(([c, w]) => [octave(c), w]);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let n = 0;
    for (const [f, w] of octaves) n += f(x, y) * w;
    const grain = (rand() - 0.5) * 18 + (rand() < 0.015 ? (rand() - 0.5) * 70 : 0);
    const v = 138 + (n - 0.5) * 120 + grain;
    const i = (y * size + x) * 4;
    img.data[i] = v; img.data[i + 1] = v * 0.97; img.data[i + 2] = v * 0.91; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // A few cracks: wandering dark lines with a lit edge, drawn three times across so they wrap.
  for (let k = 0; k < 7; k++) {
    let x = rand() * size, y = rand() * size, a = rand() * Math.PI * 2;
    const pts = [[x, y]];
    for (let j = 0, n = 8 + rand() * 16; j < n; j++) {
      a += (rand() - 0.5) * 1.1;
      x += Math.cos(a) * 5; y += Math.sin(a) * 5;
      pts.push([x, y]);
    }
    for (const [ox, oy] of [[0, 0], [-size, 0], [size, 0], [0, -size], [0, size]]) {
      for (const [dx, colour] of [[1, "rgba(235,230,215,0.35)"], [0, "rgba(30,26,20,0.55)"]]) {
        ctx.beginPath();
        pts.forEach(([px, py], j) => ctx[j ? "lineTo" : "moveTo"](px + ox + dx, py + oy + dx));
        ctx.strokeStyle = colour; ctx.lineWidth = 1; ctx.stroke();
      }
    }
  }
  return cv.toDataURL("image/png");
}
const ERAS = {
  stone: { texture: stoneTexture, vars: { "--surface-color": "#8d877c", "--hi": "#cfc8ba", "--lo": "#3a362f",
                                          "--ink": "#15120d", "--ink-soft": "#3b362d", "--pressed": "#6f6a60" } },
};
function applyEra(name) {
  const era = ERAS[name] || ERAS.stone, root = document.documentElement.style;
  for (const [k, v] of Object.entries(era.vars)) root.setProperty(k, v);
  root.setProperty("--surface", `url(${era.texture()})`);
  document.body.dataset.era = name;
}
applyEra("stone");

// ---------- flags ----------
// Nations are shown by their country's flag (the flag-icons package, by ISO alpha-2 code), with the
// nation's name as the flag's tooltip. A nation with no known flag is shown by its name.
const FLAG_URL = "https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/flags/4x3/{code}.svg";
function flag(n) {
  if (!n) return "";
  return n.flag ? `<img class="flag" src="${FLAG_URL.replace("{code}", encodeURIComponent(n.flag))}" alt="${esc(n.name)}" title="${esc(n.name)}">`
                : `<span>${esc(n.name)}</span>`;
}

// ---------- landform and cover icons ----------
// Each landform and cover type is a small drawn tile, with its name as the tooltip, in place of the
// word. A type with no icon is shown by its name.
const TYPE_ICONS = {
  water: ["#3d6fa6", `<path d="M2 8q2-2 4 0t4 0t4 0t4 0M2 13q2-2 4 0t4 0t4 0t4 0" stroke="#e2edf7" stroke-width="1.5" fill="none"/>`],
  plains: ["#cdb86e", `<path d="M2 15H18M5 15v-3M8 15v-2M11 15v-3M14 15v-2M16 15v-3" stroke="#5f4f22" stroke-width="1.3" fill="none"/>`],
  hills: ["#b08a55", `<path d="M1 16Q6 6 11 16M8 16Q13 9 19 16" stroke="#3f2c14" stroke-width="1.6" fill="none"/>`],
  mountains: ["#8f8882", `<path d="M2 17 8 5 14 17Z" fill="#45403b"/><path d="M9 17 14 8 19 17Z" fill="#5d5650"/><path d="M6.5 8 8 5 9.5 8Z" fill="#fff"/>`],
  grass: ["#86b24c", `<path d="M4 16 3 9M6.5 16 7.5 8M10 16 9 7M12.5 16 13.5 9M15.5 16 16.5 8" stroke="#2d4d13" stroke-width="1.4" fill="none"/>`],
  forest: ["#2f6a36", `<path d="M6 3 2 12H10ZM14 6 10 15H18Z" fill="#123519"/><path d="M5.3 12h1.4v4H5.3ZM13.3 15h1.4v3H13.3Z" fill="#3b2a17"/>`],
  desert: ["#e3c27a", `<circle cx="14" cy="6" r="2.6" fill="#b8641e"/><path d="M1 15Q7 9 13 14T19 13" stroke="#94662a" stroke-width="1.4" fill="none"/>`],
  sand: ["#f1e0a8", `<g fill="#a88a4a"><circle cx="4" cy="5" r="1"/><circle cx="10" cy="4" r="1"/><circle cx="15" cy="7" r="1"/><circle cx="6" cy="10" r="1"/><circle cx="12" cy="11" r="1"/><circle cx="17" cy="13" r="1"/><circle cx="4" cy="15" r="1"/><circle cx="10" cy="16" r="1"/></g>`],
  wetlands: ["#6b8a63", `<path d="M2 16q2-1.5 4 0t4 0t4 0t4 0" stroke="#d3e4da" stroke-width="1.3" fill="none"/><path d="M6 14V6M9.5 14V8M13 14V5M16 14V8" stroke="#1f331c" stroke-width="1.2"/><path d="M5.2 6h1.6v3H5.2ZM12.2 5h1.6v3H12.2Z" fill="#4a2f17"/>`],
  tundra: ["#bccfd1", `<path d="M2 15q2.5-4 5 0M8 16q2.5-4 5 0M13 13q2.5-4 5 0" stroke="#3f5a43" stroke-width="1.4" fill="#6f8a6f"/><g fill="#fff"><circle cx="5" cy="5" r="0.9"/><circle cx="11" cy="7" r="0.9"/><circle cx="16" cy="4" r="0.9"/></g>`],
  ice: ["#eaf4f8", `<path d="M3 5 8 9 6 14M8 9 14 8 17 13M14 8 16 3" stroke="#6f98ae" stroke-width="1.3" fill="none"/>`],
};
function typeIcon(name, size = 0) {   // size: 0 for half the tile or more, 1 for a quarter to a half, 2 for less
  const icon = TYPE_ICONS[name];
  if (!icon) return `<span>${esc(name)}</span>`;
  return `<span class="ticon${size ? ` size${size}` : ""}" title="${esc(name)}" role="img" aria-label="${esc(name)}"><svg viewBox="0 0 20 20"><rect width="20" height="20" fill="${icon[0]}"/>${icon[1]}</svg></span>`;
}

// Small drawn symbols that stand in for words, each with the word as its tooltip.
const GLYPHS = {
  people: `<circle cx="10" cy="5" r="3.2"/><path d="M4 19v-5.5a6 6 0 0 1 12 0V19Z"/>`,
  play: `<path d="M5 3 17 10 5 17Z"/>`,
  food: `<ellipse cx="10" cy="4.6" rx="1.9" ry="3.8"/><ellipse cx="6.3" cy="6.2" rx="1.7" ry="3.4" transform="rotate(-28 6.3 6.2)"/>` +
        `<ellipse cx="13.7" cy="6.2" rx="1.7" ry="3.4" transform="rotate(28 13.7 6.2)"/>` +
        `<path d="M7.6 9.6 9.2 12.4 5.4 19h1.8L10 14.1l2.8 4.9h1.8l-3.8-6.6 1.6-2.8h-1.3L10 11.5 8.9 9.6Z"/><rect x="7.6" y="11.5" width="4.8" height="2" rx=".7"/>`,
  wait: `<path d="M5 2h10v1.5c0 3-2.5 4.8-4 6.5 1.5 1.7 4 3.5 4 6.5V18H5v-1.5c0-3 2.5-4.8 4-6.5-1.5-1.7-4-3.5-4-6.5Z"/>`,
};
const glyph = (name, title) => `<span class="glyph" title="${esc(title)}" role="img" aria-label="${esc(title)}"><svg viewBox="0 0 20 20" fill="currentColor">${GLYPHS[name]}</svg></span>`;

const leaderLabel = s => s.nation ? `${flag(s.nation)} ${esc(s.kind)}` : esc(s.kind);   // e.g. [flag] Chieftain

// ---------- choosing a nation ----------
let nations = [], nationId = null;

async function loadNations() {
  try {
    nations = (await api("/api/nations")).nations;
  } catch (e) {
    $("chooseMsg").textContent = "The world can't be reached.";
    return;
  }
  if (!nations.length) { $("chooseMsg").textContent = "No world has begun yet."; return; }
  const remembered = +store.get("capita.player.nation");
  $("nationList").innerHTML = nations.map(n =>
    `<button class="btn" data-id="${n.id}">${flag(n)}<span class="name">${esc(n.name)}</span></button>`).join("");
  if (nations.some(n => n.id === remembered)) pickNation(remembered);
}
function pickNation(id) {
  nationId = id;
  const n = nations.find(n => n.id === id);
  $("nationList").querySelectorAll(".btn").forEach(b => b.classList.toggle("on", +b.dataset.id === id));
  $("nationList").querySelector(".on")?.scrollIntoView({ block: "nearest" });
  $("nationName").disabled = false;
  $("nationName").value = n.name;
  $("begin").disabled = false;
  $("chooseMsg").textContent = "";
}
$("nationList").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (b) pickNation(+b.dataset.id);
});
$("nationName").addEventListener("keydown", e => { if (e.key === "Enter") $("begin").click(); });
$("begin").addEventListener("click", async () => {
  const n = nations.find(n => n.id === nationId);
  const name = $("nationName").value.trim().replace(/\s+/g, " ");
  $("begin").disabled = true;
  try {
    if (name !== n.name) {
      n.name = (await api(`/api/nation/${nationId}/name`, { name })).name;
      $("nationList").querySelector(".on .name").textContent = n.name;
    }
  } catch (e) {
    $("chooseMsg").textContent = e.message;
    $("begin").disabled = false;
    return;
  }
  store.set("capita.player.nation", String(nationId));
  $("choose").hidden = true;
  $("game").hidden = false;
  startGame();
});
loadNations();

// ---------- the tile grid (a JavaScript copy of server/grid.py) ----------
// Tile ids name the south-west corner in tenths of a degree. The page uses them to draw the map and
// never shows them: the player doesn't know where in the world they are.
let TILE = 0.5, COLS = 720, ROWS = 360;
const D2R = Math.PI / 180;
function parseTileId(tid) {
  return { lat: +tid.slice(1, 4) / 10 * (tid[0] === "N" ? 1 : -1), lon: +tid.slice(5, 9) / 10 * (tid[4] === "E" ? 1 : -1) };
}
function tileId(lat, lon) {
  const la = Math.round(lat * 10), lo = Math.round(lon * 10);
  return `${la >= 0 ? "N" : "S"}${String(Math.abs(la)).padStart(3, "0")}${lo >= 0 ? "E" : "W"}${String(Math.abs(lo)).padStart(4, "0")}`;
}
function tileAt(lat, lon) {
  const r = Math.max(0, Math.min(ROWS - 1, ROWS - 1 - Math.floor((lat + 90) / TILE)));
  const c = ((Math.floor((lon + 180) / TILE) % COLS) + COLS) % COLS;
  return tileId(90 - (r + 1) * TILE, c * TILE - 180);
}
function tileIndex(tid) {
  const { lat, lon } = parseTileId(tid);
  return Math.round((90 - TILE - lat) / TILE) * COLS + Math.round((lon + 180) / TILE);
}
function tileCentre(tid) {
  const { lat, lon } = parseTileId(tid);
  return { lat: lat + TILE / 2, lon: lon + TILE / 2 };
}
const wrapLon = d => ((d + 180) % 360 + 360) % 360 - 180;
// Same layout as THREE.SphereGeometry's UVs, so the globe image lines up.
function latLonToVec(lat, lon, r = 1) {
  const theta = (lon + 180) / 360 * Math.PI * 2, phi = (90 - lat) / 180 * Math.PI;
  return new THREE.Vector3(-Math.cos(theta) * Math.sin(phi) * r, Math.cos(phi) * r, Math.sin(theta) * Math.sin(phi) * r);
}
function vecToLatLon(v) {
  const n = v.clone().normalize();
  const lat = Math.asin(THREE.MathUtils.clamp(n.y, -1, 1)) / D2R;
  let theta = Math.atan2(n.z, -n.x);
  if (theta < 0) theta += Math.PI * 2;
  return { lat, lon: wrapLon(theta / (Math.PI * 2) * 360 - 180) };
}

// ---------- the map ----------
// Underneath it is the same globe as the developer view, but the camera hangs low over it looking
// straight down, with north up, so only a handful of tiles fill the screen and the surface looks flat.
// There is no shading, no sky and no globe edge. Tiles never explored are black; explored tiles they
// can't see now are dimmed. The player can zoom only between SPAN_MIN and SPAN_MAX tiles top to
// bottom, and the edges of the screen stay within about MARGIN tiles of what they have explored: they
// can't zoom out or pan further than that (clampCamera()), except that the screen never gets smaller
// than SPAN_MIN tiles, so a narrow strip can show a little more darkness on its sides.
const SPAN_MIN = 3, SPAN_MAX = 8, SPAN_START = 6, MARGIN = 2.5;
const FOV = 30;
const R_FOG = 1.0003, R_GRID = 1.00025, R_MARK = 1.0004;
let renderer, scene, camera, globe, fogTex, fogImg, gridLines = null, hoverLine = null, selectLine = null;
const markers = new THREE.Group();
const fogCanvas = document.createElement("canvas");
const cam = { lat: 0, lon: 0, span: SPAN_START, goal: null };   // the point at the middle of the screen
let bounds = null;      // { lat0, lat1, ref, d0, d1 }: where the screen may show, in degrees (d = lon - ref)
let META = null;

async function initMap() {
  META = await api("/api/meta");
  TILE = META.tile_size_degrees; COLS = META.width; ROWS = META.height;
  renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000);
  $("view").append(renderer.domElement);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 1, 0.0001, 4);
  globe = new THREE.Mesh(new THREE.SphereGeometry(1, 360, 180), new THREE.MeshBasicMaterial({ color: 0x000000 }));
  scene.add(globe);
  scene.add(detailGroup);
  loadGlobeTexture(META.textures);

  fogCanvas.width = COLS; fogCanvas.height = ROWS;
  fogImg = fogCanvas.getContext("2d").createImageData(COLS, ROWS);
  fogTex = new THREE.CanvasTexture(fogCanvas);
  fogTex.magFilter = THREE.NearestFilter; fogTex.minFilter = THREE.NearestFilter; fogTex.generateMipmaps = false;
  // The overlays skip the depth test and draw in renderOrder: the far side of the sphere faces away, so
  // nothing behind the near surface can show through.
  const fog = new THREE.Mesh(new THREE.SphereGeometry(R_FOG, 360, 180),
    new THREE.MeshBasicMaterial({ map: fogTex, transparent: true, depthWrite: false, depthTest: false }));
  fog.renderOrder = 3;
  scene.add(fog);
  markers.renderOrder = 6;
  scene.add(markers);

  new ResizeObserver(resize).observe($("view"));
  resize();
  bindMapInput();
  requestAnimationFrame(frame);
}

function chooseTexture(textures) {
  const gpuMax = renderer.capabilities.maxTextureSize;
  const sizes = [...(textures || [])].sort((a, b) => a.width - b.width);
  const fits = sizes.filter(t => t.width <= gpuMax);
  return fits.length ? fits[fits.length - 1] : sizes[0];
}
function loadGlobeTexture(textures) {
  const pick = chooseTexture(textures);
  if (!pick) return;
  new THREE.TextureLoader().load(pick.url, tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    globe.material.map = tex;
    globe.material.color.set(0xffffff);
    globe.material.needsUpdate = true;
  });
  setupDetail(META.globe_tiles, pick.width);
}

// Detail tiles: sharper pieces of the globe image (server/make_globe_tiles.py), chosen every frame for
// what is on screen, as in the developer view. Level L has 2^(L+1) x 2^L pieces of tile_px pixels.
let DETAIL = null, detailMinLevel = 0, detailFrame = 0, detailLoads = 0;
const detail = new Map();
const detailGroup = new THREE.Group();
const DETAIL_MAX_LOADS = 6, DETAIL_CACHE = 120;
const detailFrustum = new THREE.Frustum(), detailMatrix = new THREE.Matrix4(), detailSphere = new THREE.Sphere();
function setupDetail(info, baseWidth) {
  if (!info) return;
  DETAIL = info;
  const w0 = info.tile_px * info.level0.cols;
  detailMinLevel = 0;
  while (detailMinLevel < info.levels && w0 * 2 ** detailMinLevel <= (baseWidth || 0)) detailMinLevel++;
}
function detailPiece(L, x, y) {
  const key = `${L}/${x}/${y}`;
  let e = detail.get(key);
  if (e) return e;
  const deg = 180 / 2 ** L;
  const geo = new THREE.SphereGeometry(1.0001 + L * 0.00002, 16, 16, x * deg * D2R, deg * D2R, y * deg * D2R, deg * D2R);
  e = { mesh: new THREE.Mesh(geo, new THREE.MeshBasicMaterial()), state: "new", used: 0 };
  e.mesh.visible = false;
  detailGroup.add(e.mesh);
  detail.set(key, e);
  return e;
}
function loadDetailPiece(L, x, y, e) {
  e.state = "loading";
  detailLoads++;
  const url = DETAIL.url.replace("{level}", L).replace("{x}", x).replace("{y}", y);
  new THREE.TextureLoader().load(url, tex => {
    detailLoads--;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const g = DETAIL.gutter || 0, side = DETAIL.tile_px + 2 * g;
    tex.offset.set(g / side, g / side);
    tex.repeat.set(DETAIL.tile_px / side, DETAIL.tile_px / side);
    if (!detail.has(`${L}/${x}/${y}`)) { tex.dispose(); return; }
    e.mesh.material.map = tex;
    e.mesh.material.needsUpdate = true;
    e.state = "ready";
  }, undefined, () => { detailLoads--; e.state = "failed"; });
}
function updateDetail() {
  if (!DETAIL || detailMinLevel >= DETAIL.levels) return;
  detailFrame++;
  const d = camera.position.length(), camDir = camera.position.clone().normalize();
  const horizon = Math.acos(Math.min(1, 1 / d));
  const pxPerRad = renderer.domElement.clientHeight / (2 * Math.tan(camera.fov * D2R / 2));
  camera.updateMatrixWorld();
  detailMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  detailFrustum.setFromProjectionMatrix(detailMatrix);
  const wanted = [];
  const visit = (L, x, y) => {
    const deg = 180 / 2 ** L;
    const c = latLonToVec(90 - (y + 0.5) * deg, -180 + (x + 0.5) * deg);
    const radius = deg * D2R * Math.SQRT1_2;
    const ang = Math.acos(THREE.MathUtils.clamp(c.dot(camDir), -1, 1));
    if (ang - radius > horizon) return;
    detailSphere.set(c, 2 * Math.sin(radius / 2));
    if (!detailFrustum.intersectsSphere(detailSphere)) return;
    const near = Math.max(0, ang - radius);
    const dist = Math.sqrt(d * d + 1 - 2 * d * Math.cos(near));
    const screenPx = deg * D2R / Math.max(dist, 1e-4) * pxPerRad;
    if (screenPx > DETAIL.tile_px && L < DETAIL.levels - 1) {
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) visit(L + 1, 2 * x + i, 2 * y + j);
    } else if (L >= detailMinLevel) {
      wanted.push({ L, x, y, dist });
    }
  };
  for (let x = 0; x < DETAIL.level0.cols; x++) visit(0, x, 0);
  const show = new Set(), missing = [];
  for (const w of wanted) {
    const e = detailPiece(w.L, w.x, w.y);
    e.used = detailFrame;
    if (e.state === "ready") { show.add(e); continue; }
    if (e.state === "new") missing.push({ ...w, e });
    for (let L = w.L - 1, x = w.x >> 1, y = w.y >> 1; L >= detailMinLevel; L--, x >>= 1, y >>= 1) {
      const a = detail.get(`${L}/${x}/${y}`);
      if (a && a.state === "ready") { a.used = detailFrame; show.add(a); break; }
    }
  }
  for (const e of detail.values()) e.mesh.visible = show.has(e);
  missing.sort((a, b) => a.L - b.L || a.dist - b.dist);
  for (const m of missing) {
    if (detailLoads >= DETAIL_MAX_LOADS) break;
    loadDetailPiece(m.L, m.x, m.y, m.e);
  }
  if (detail.size > DETAIL_CACHE) {
    const old = [...detail].filter(([, e]) => e.used < detailFrame && e.state !== "loading").sort((a, b) => a[1].used - b[1].used);
    for (const [key, e] of old.slice(0, detail.size - DETAIL_CACHE)) {
      detailGroup.remove(e.mesh);
      e.mesh.geometry.dispose(); e.mesh.material.map?.dispose(); e.mesh.material.dispose();
      detail.delete(key);
    }
  }
}

function resize() {
  const v = $("view"), w = v.clientWidth, h = v.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// The camera: above the middle point, high enough that `span` tiles fit top to bottom, north up.
function placeCamera() {
  const h = cam.span * TILE * D2R / (2 * Math.tan(FOV * D2R / 2));
  const p = latLonToVec(cam.lat, cam.lon);
  const north = latLonToVec(Math.min(89.9, cam.lat + 0.01), cam.lon).sub(p).normalize();
  camera.position.copy(p).multiplyScalar(1 + h);
  camera.up.copy(north);
  camera.lookAt(p);
  camera.near = h * 0.05; camera.far = h + 1;
  camera.updateProjectionMatrix();
}
// Keep the screen inside `bounds`: zoom out no further than it fits, and keep its middle far enough
// from the edges. Where the screen is wider than the bounds, it is centred on them. (Rough: the screen
// is treated as a rectangle of latitude and longitude.)
function clampCamera() {
  const clamp = THREE.MathUtils.clamp;
  if (!bounds) { cam.span = clamp(cam.span, SPAN_MIN, SPAN_MAX); return; }
  const aspect = camera.aspect || 1, cos = Math.max(0.05, Math.cos(cam.lat * D2R));
  const fit = Math.min(bounds.lat1 - bounds.lat0, (bounds.d1 - bounds.d0) * cos / aspect) / TILE;
  cam.span = clamp(cam.span, SPAN_MIN, clamp(fit, SPAN_MIN, SPAN_MAX));
  const hLat = cam.span * TILE / 2, hLon = hLat * aspect / cos;   // half the screen, in degrees
  const inside = (v, lo, hi, h) => lo + h <= hi - h ? clamp(v, lo + h, hi - h) : (lo + hi) / 2;
  cam.lat = inside(cam.lat, bounds.lat0, bounds.lat1, hLat);
  cam.lon = wrapLon(bounds.ref + inside(wrapLon(cam.lon - bounds.ref), bounds.d0, bounds.d1, hLon));
}
function flyTo(lat, lon) { cam.goal = { lat, lon }; }

function frame() {
  const before = { lat: cam.lat, lon: cam.lon };
  if (cam.goal) {   // ease toward a point the page chose (a new turn's leader)
    const dl = wrapLon(cam.goal.lon - cam.lon), dla = cam.goal.lat - cam.lat;
    if (Math.abs(dl) + Math.abs(dla) < 1e-4) { cam.lat = cam.goal.lat; cam.lon = cam.goal.lon; cam.goal = null; }
    else { cam.lat += dla * 0.15; cam.lon = wrapLon(cam.lon + dl * 0.15); }
  }
  clampCamera();
  if (cam.goal && Math.abs(cam.lat - before.lat) + Math.abs(wrapLon(cam.lon - before.lon)) < 1e-7) cam.goal = null;   // held at the edge
  placeCamera();
  updateDetail();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Drag to move, wheel to zoom, click to choose a tile.
function bindMapInput() {
  const el = renderer.domElement, ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let down = null, dragged = false;
  const pick = e => {
    const r = el.getBoundingClientRect();
    ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObject(globe, false)[0];
    return hit ? vecToLatLon(hit.point) : null;
  };
  el.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; dragged = false; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e => {
    if (down) {
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (!dragged && Math.hypot(dx, dy) < 4) return;
      dragged = true;
      el.classList.add("dragging");
      const degPerPx = cam.span * TILE / el.clientHeight;
      cam.goal = null;
      cam.lat += dy * degPerPx;
      cam.lon = wrapLon(cam.lon - dx * degPerPx / Math.max(0.05, Math.cos(cam.lat * D2R)));
      down = { x: e.clientX, y: e.clientY };
      return;
    }
    const ll = pick(e);
    setHover(ll ? tileAt(ll.lat, ll.lon) : null);
  });
  el.addEventListener("pointerup", e => {
    el.classList.remove("dragging");
    const was = dragged;
    down = null; dragged = false;
    if (was) return;
    const ll = pick(e);
    const tid = ll ? tileAt(ll.lat, ll.lon) : null;
    selectTile(tid && known.has(tid) ? tid : null);
  });
  el.addEventListener("pointerleave", () => setHover(null));
  el.addEventListener("wheel", e => {
    e.preventDefault();
    cam.span *= Math.exp(e.deltaY * 0.0012);
  }, { passive: false });
}

// ---------- what the nation knows ----------
let VIEW = null;               // /api/nation/<id>/view
const known = new Map();       // tile id -> {id, seen, terrain}
let segsByTile = new Map();    // tile id -> [segment]
let selected = null, hovered = null, focusLeader = null;

async function loadView(follow) {
  const v = await api(`/api/nation/${nationId}/view`);
  VIEW = v;
  known.clear();
  for (const t of v.tiles) known.set(t.id, t);
  segsByTile = new Map();
  for (const s of v.segments) (segsByTile.get(s.tile) || segsByTile.set(s.tile, []).get(s.tile)).push(s);
  paintFog();
  buildGrid();
  drawMarkers();
  findBounds();
  // Keep the chosen leader in view: after a turn, select the tile they are on now.
  const lead = v.segments.find(s => s.own && s.leader === focusLeader) || v.segments.find(s => s.own);
  if (follow && lead) {
    focusLeader = lead.leader;
    const c = tileCentre(lead.tile);
    flyTo(c.lat, c.lon);
    selected = lead.tile;
  }
  if (selected && !known.has(selected)) selected = null;
  drawOutlines();
  renderSide();
  renderOrders();
  renderStatus();
}

// The fog. Far from what the nation knows, a layer with one pixel per tile is simply black. Around the
// explored tiles (FOG_PAD tiles past them on every side) that layer is clear, and a finer patch, FOG_PX
// pixels per tile, draws the fog with soft, slightly ragged edges: each pixel blends the darkness of
// the nearest tiles (clear where the nation sees, FOG_DIM where it only remembers, black where it has
// never been), easing from one to the next over about 2 x FOG_SOFT of a tile around each tile edge, at
// a point nudged by up to FOG_JITTER of a tile with smooth noise fixed to the map.
const FOG_PX = 12, FOG_PAD = 4, FOG_SOFT = 0.3, FOG_JITTER = 0.14, FOG_DIM = 150 / 255;
let fogPatch = null;

function hash2(x, y) {   // a fixed pseudo-random value in [0, 1) for integer lattice points
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise2(x, y, period) {   // smooth value noise; x repeats every `period` (the world wraps east-west)
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const h = (i, j) => hash2(((x0 + i) % period + period) % period, y0 + j);
  const a = h(0, 0), b = h(1, 0), c = h(0, 1), d = h(1, 1);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

function paintFog() {
  const d = fogImg.data;
  for (let i = 0; i < COLS * ROWS; i++) d[i * 4 + 3] = 255;    // black wherever nothing is known
  if (fogPatch) { scene.remove(fogPatch); fogPatch.geometry.dispose(); fogPatch.material.map.dispose(); fogPatch.material.dispose(); fogPatch = null; }
  if (known.size) {
    // The patch's tiles: rows r0.., columns c0 + dc0.. (columns counted from the home tile's, so it
    // can cross the 180th meridian).
    const home = tileIndex(VIEW.home || known.keys().next().value), cHome = home % COLS;
    let r0 = ROWS, r1 = -1, dc0 = COLS, dc1 = -COLS;
    for (const id of known.keys()) {
      const i = tileIndex(id), r = Math.floor(i / COLS), dc = ((i % COLS - cHome + COLS * 1.5) % COLS) - COLS / 2;
      r0 = Math.min(r0, r); r1 = Math.max(r1, r); dc0 = Math.min(dc0, dc); dc1 = Math.max(dc1, dc);
    }
    r0 = Math.max(0, r0 - FOG_PAD); r1 = Math.min(ROWS - 1, r1 + FOG_PAD); dc0 -= FOG_PAD; dc1 += FOG_PAD;
    const W = Math.min(COLS, dc1 - dc0 + 1), H = r1 - r0 + 1, cWest = cHome + dc0;
    const dark = new Float32Array(W * H).fill(1);
    for (const t of known.values()) {
      const i = tileIndex(t.id), r = Math.floor(i / COLS), dc = ((i % COLS - cWest) % COLS + COLS) % COLS;
      if (dc < W) dark[(r - r0) * W + dc] = t.seen ? 0 : FOG_DIM;
    }
    for (let r = r0; r <= r1; r++) for (let k = 0; k < W; k++) d[(r * COLS + ((cWest + k) % COLS + COLS) % COLS) * 4 + 3] = 0;
    const P = Math.max(2, Math.min(FOG_PX, Math.floor(2048 / Math.max(W, H))));
    const cv = document.createElement("canvas");
    cv.width = W * P; cv.height = H * P;
    const ctx = cv.getContext("2d"), img = ctx.createImageData(cv.width, cv.height);
    const at = (k, j) => k < 0 || j < 0 || k >= W || j >= H ? 1 : dark[j * W + k];
    for (let py = 0; py < cv.height; py++) for (let px = 0; px < cv.width; px++) {
      const X = (px + 0.5) / P, Y = (py + 0.5) / P;             // in tiles from the patch's north-west corner
      const gx = (cWest + X) * 2, gy = (r0 + Y) * 2;              // map-fixed noise, two bumps per tile
      const sx = X - 0.5 + (noise2(gx, gy, COLS * 2) - 0.5) * 2 * FOG_JITTER;
      const sy = Y - 0.5 + (noise2(gx + 57.3, gy + 91.7, COLS * 2) - 0.5) * 2 * FOG_JITTER;
      const k = Math.floor(sx), j = Math.floor(sy);
      const u = smooth(0.5 - FOG_SOFT, 0.5 + FOG_SOFT, sx - k), v = smooth(0.5 - FOG_SOFT, 0.5 + FOG_SOFT, sy - j);
      const top = at(k, j) + (at(k + 1, j) - at(k, j)) * u, bottom = at(k, j + 1) + (at(k + 1, j + 1) - at(k, j + 1)) * u;
      img.data[(py * cv.width + px) * 4 + 3] = Math.round(255 * (top + (bottom - top) * v));
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(cv);
    tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
    // A piece of sphere over exactly those tiles (longitude from 180 W, colatitude from the north pole).
    const geo = new THREE.SphereGeometry(R_FOG + 0.00001, Math.max(2, W * 2), Math.max(2, H * 2),
      cWest * TILE * D2R, W * TILE * D2R, r0 * TILE * D2R, H * TILE * D2R);
    fogPatch = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
    fogPatch.renderOrder = 3;
    scene.add(fogPatch);
  }
  fogCanvas.getContext("2d").putImageData(fogImg, 0, 0);
  fogTex.needsUpdate = true;
}

// Grid lines only around explored tiles: the darkness has none.
function buildGrid() {
  if (gridLines) { scene.remove(gridLines); gridLines.geometry.dispose(); }
  const pts = [];
  for (const t of known.values()) {
    const { lat, lon } = parseTileId(t.id);
    const a = latLonToVec(lat, lon, R_GRID), b = latLonToVec(lat, lon + TILE, R_GRID);
    const c = latLonToVec(lat + TILE, lon + TILE, R_GRID), d = latLonToVec(lat + TILE, lon, R_GRID);
    pts.push(a, b, b, c, c, d, d, a);
  }
  gridLines = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, depthWrite: false, depthTest: false }));
  gridLines.renderOrder = 2;
  scene.add(gridLines);
}

function findBounds() {
  if (!known.size) { bounds = null; return; }
  const ref = VIEW.home ? tileCentre(VIEW.home).lon : tileCentre(known.keys().next().value).lon;
  let lat0 = 90, lat1 = -90, d0 = 180, d1 = -180;
  for (const id of known.keys()) {
    const c = tileCentre(id), d = wrapLon(c.lon - ref);
    lat0 = Math.min(lat0, c.lat); lat1 = Math.max(lat1, c.lat); d0 = Math.min(d0, d); d1 = Math.max(d1, d);
  }
  const m = (MARGIN + 0.5) * TILE;   // from the explored tiles' centres to MARGIN tiles past their edges
  bounds = { lat0: lat0 - m, lat1: lat1 + m, ref, d0: d0 - m, d1: d1 + m };
}

// Tile outlines: the tile under the pointer, and the chosen one.
function outline(tid, colour, r) {
  const { lat, lon } = parseTileId(tid);
  const g = new THREE.BufferGeometry().setFromPoints([latLonToVec(lat, lon, r), latLonToVec(lat, lon + TILE, r),
    latLonToVec(lat + TILE, lon + TILE, r), latLonToVec(lat + TILE, lon, r)]);
  const line = new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: colour, depthTest: false, transparent: true }));
  line.renderOrder = 5;
  return line;
}
function drawOutlines() {
  for (const l of [hoverLine, selectLine]) if (l) { scene.remove(l); l.geometry.dispose(); }
  hoverLine = hovered && hovered !== selected && known.has(hovered) ? outline(hovered, 0xd9d2c0, R_MARK) : null;
  selectLine = selected ? outline(selected, 0xffe08a, R_MARK) : null;
  for (const l of [hoverLine, selectLine]) if (l) scene.add(l);
}
function setHover(tid) {
  if (tid === hovered) return;
  hovered = tid;
  drawOutlines();
}
function selectTile(tid) {
  if (tid !== selected) pinnedLeader = null;
  selected = tid;
  closeMenu();
  drawOutlines();
  renderSide();
}

// Camps are drawn by /camps.js (server/static/camps.js, shared with the developer view). An ordered
// move is drawn as a line from the segment to the tile it heads for.
const ORDER_LINE = new THREE.LineBasicMaterial({ color: 0xffe08a, depthTest: false, transparent: true });
const OFFSETS = { n: [1, 0], ne: [1, 1], e: [0, 1], se: [-1, 1], s: [-1, 0], sw: [-1, -1], w: [0, -1], nw: [1, -1] };

function quad(lat, lon, size) {   // a square `size` degrees of latitude across, flat on the surface
  const k = 1 / Math.max(0.05, Math.cos(lat * D2R)), h = size / 2;
  const v = [latLonToVec(lat - h, lon - h * k, R_MARK), latLonToVec(lat - h, lon + h * k, R_MARK),
             latLonToVec(lat + h, lon + h * k, R_MARK), latLonToVec(lat + h, lon - h * k, R_MARK)];
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(v.flatMap(p => [p.x, p.y, p.z]), 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  return g;
}
function drawMarkers() {
  for (const m of [...markers.children]) { markers.remove(m); m.geometry.dispose(); }
  drawCamps(markers, VIEW.camps, { tile: TILE, parseTileId, tileIndex, quad });
  for (const list of segsByTile.values()) {
    list.forEach(s => {
      const [lat, lon] = s.position;
      if (s.own && s.order?.direction) {
        const c = tileCentre(s.tile), [up, east] = OFFSETS[s.order.direction];
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([latLonToVec(lat, lon, R_MARK),
          latLonToVec(c.lat + up * TILE, c.lon + east * TILE, R_MARK)]), ORDER_LINE);
        line.renderOrder = 6;
        markers.add(line);
      }
    });
  }
}

// ---------- the side bar ----------
const DIR_LABEL = { n: "N", ne: "NE", e: "E", se: "SE", s: "S", sw: "SW", w: "W", nw: "NW" };
const orderText = o => o.type === "found_kingdom" ? "found a kingdom"
  : o.type === "establish_settlement" ? "establish a settlement"
  : o.type === "form_settlers" ? `form settlers (${o.people})`
  : `move ${DIR_LABEL[o.direction] || ""}`;
// The orders that settle a segment under a title the player chooses: the menu's words for each.
const SETTLE = {
  found_kingdom: { button: "Found a kingdom", confirm: "Found the kingdom",
    ask: "Found a kingdom here? Your people will settle on this land for good, to farm it and herd animals, and will no longer move." },
  establish_settlement: { button: "Establish a settlement", confirm: "Establish the settlement",
    ask: "Establish a settlement here? These settlers will make this land their home for good, to farm it and herd animals, and will no longer move." },
};
function renderSide() {
  const t = selected ? known.get(selected) : null;
  // Landforms, then what covers the land, each largest first, as rows of icons sized roughly by share.
  $("terrain").innerHTML = t ? [t.terrain.map((k, j) => typeIcon(VIEW.terrain_types[k], t.terrain_size[j])),
                                t.cover.map((k, j) => typeIcon(VIEW.cover_types[k], t.cover_size[j]))]
    .filter(list => list.length).map(list => `<div class="types">${list.join("")}</div>`).join("") : "";
  renderPlace(t);
  const segs = t && t.seen ? segsByTile.get(t.id) || [] : [];
  $("segments").innerHTML = segs.map(s => `<button class="btn seg" data-leader="${s.leader}">
      ${leaderLabel(s)}${s.own ? `<span class="people">${s.people.toLocaleString()} ${glyph("people", s.people === 1 ? "person" : "people")}</span>` : ""}
      ${s.order ? `<span class="order">Orders: ${orderText(s.order)}</span>` : ""}</button>`).join("");
  renderInfo();
}

// The place box: what the player calls the chosen tile ("Unnamed land" until they name it). Clicking
// it edits the name (Enter saves, Escape cancels, an empty name takes it back). Names are the
// nation's own; once some technology lets a nation learn what others call a tile, the server adds
// those ("place_others") and the box's tooltip lists them.
let placeEditing = null;   // the tile whose name is being edited
function renderPlace(t) {
  const box = $("place");
  if (placeEditing && t && placeEditing === t.id) return;   // don't disturb the typing on a poll
  placeEditing = null;
  if (!t) { box.textContent = ""; box.removeAttribute("title"); return; }
  box.textContent = t.place || "Unnamed land";
  box.classList.toggle("unnamed", !t.place);
  box.title = t.place_others ? "Also called: " + t.place_others.map(o => `${o.name} (${o.nation.name})`).join(", ")
                             : "Click to name this land";
}
$("place").addEventListener("click", () => {
  const t = selected ? known.get(selected) : null;
  if (!t || placeEditing) return;
  placeEditing = t.id;
  const box = $("place");
  box.classList.remove("unnamed");
  box.innerHTML = `<input id="placeName" maxlength="30" spellcheck="false" placeholder="Unnamed land" value="${esc(t.place || "")}">`;
  $("placeName").focus();
  $("placeName").select();
});
$("place").addEventListener("keydown", async e => {
  if (e.key === "Escape") { e.stopPropagation(); placeEditing = null; renderSide(); }
  if (e.key !== "Enter" || !placeEditing) return;
  const tid = placeEditing, name = $("placeName").value.trim();
  try {
    const out = await api(`/api/nation/${nationId}/place`, { tile: tid, name: name || null });
    const t = known.get(tid);
    if (t) { if (out.place) t.place = out.place; else delete t.place; }
    say("");
  } catch (err) {
    say(err.message);
  }
  placeEditing = null;
  renderSide();
});
$("place").addEventListener("focusout", () => { if (placeEditing) { placeEditing = null; renderSide(); } });

// The info box under the tile's leaders: what is known about one of their segments. It shows the
// leader under the pointer, else the one last clicked on this tile, else the player's own leader
// with the most people here (else the first listed).
let pinnedLeader = null, hoverLeader = null;
function shownSegment() {
  const t = selected ? known.get(selected) : null;
  const segs = t && t.seen ? segsByTile.get(t.id) || [] : [];
  const own = segs.filter(s => s.own).sort((a, b) => b.people - a.people);
  return segs.find(s => s.leader === hoverLeader) || segs.find(s => s.leader === pinnedLeader) || own[0] || segs[0] || null;
}
function renderInfo() {
  const s = shownSegment();
  $("segments").querySelectorAll(".seg").forEach(b => b.classList.toggle("shown", !!s && +b.dataset.leader === s.leader));
  $("info").innerHTML = !s ? "" : `<div class="title">${leaderLabel(s)}</div>` + (s.own
    ? `<p class="counts"><span>${s.people.toLocaleString()} ${glyph("people", s.people === 1 ? "person" : "people")}</span>` +
      (s.food == null ? "" : `<span title="Food this past year, in years of an adult's eating">${s.food.toLocaleString()} ${glyph("food", "food")}` +
        (s.spare > 0 ? ` (+${s.spare.toLocaleString()} surplus)` : s.spare < 0 ? ` (−${(-s.spare).toLocaleString()} shortage)` : "") + `</span>`) +
      `</p><p>${esc(s.situation)}</p>`
    : `<p>They appear to be ${esc(s.known.size)}.</p>`);
}
$("segments").addEventListener("mouseover", e => {
  const b = e.target.closest("button[data-leader]");
  if (b && +b.dataset.leader !== hoverLeader) { hoverLeader = +b.dataset.leader; renderInfo(); }
});
$("segments").addEventListener("mouseleave", () => { hoverLeader = null; renderInfo(); });
// The orders box: every order given to the nation's leaders this turn, one per leader. Choosing a
// leader there chooses their tile; the cross cancels the order.
function renderOrders() {
  const ordered = VIEW.segments.filter(s => s.own && s.order), box = $("ordersBox");
  const html = `<div class="head">Orders</div>` + ordered.map(s => `<div class="row">
      <button class="who" data-leader="${s.leader}">${leaderLabel(s)}: ${orderText(s.order)}</button>
      <button class="btn x" data-cancel="${s.leader}" title="Cancel this order"${canOrder() ? "" : " disabled"}>✕</button></div>`).join("");
  box.hidden = !ordered.length;
  if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; }   // not mid-click on every poll
}
$("ordersBox").addEventListener("click", async e => {
  const who = e.target.closest("[data-leader]"), cancel = e.target.closest("[data-cancel]");
  if (who) {
    const s = VIEW.segments.find(s => s.leader === +who.dataset.leader);
    focusLeader = s.leader;
    const c = tileCentre(s.tile);
    flyTo(c.lat, c.lon);
    selectTile(s.tile);
  } else if (cancel) {
    await giveOrder(VIEW.segments.find(s => s.leader === +cancel.dataset.cancel), null);
  }
});

$("segments").addEventListener("click", e => {
  const b = e.target.closest("button[data-leader]");
  if (!b) return;
  const s = VIEW.segments.find(s => s.leader === +b.dataset.leader);
  pinnedLeader = s.leader;
  renderInfo();
  if (s.own && s.commands.length) { focusLeader = s.leader; openMenu(s, b); }   // a king takes no orders, for now
  else closeMenu();
});

// ---------- a leader's menus ----------
// Clicking one of the player's own leaders opens their orders, those their type can take: Move, to one
// of the 8 tiles around; Found a kingdom or Establish a settlement, which ask for confirmation and a
// title; Form settlers, which asks how many people go; and cancelling an order. (What is known about a
// leader is in the info box.)
let menuFor = null, menuAnchor = null;
function openMenu(s, anchor) {
  menuFor = s; menuAnchor = anchor;
  showMenu("orders");
}
function closeMenu() { $("menu").hidden = true; menuFor = null; }
const canOrder = () => VIEW && VIEW.phase === "orders" && status.phase === "orders" && status.turn === VIEW.turn && !committing;

function showMenu(page) {
  const s = menuFor, m = $("menu");
  let html = `<div class="title">${leaderLabel(s)}</div>`;
  const off = canOrder() ? "" : " disabled";
  if (page === "orders") {
    if (s.commands.includes("move")) html += `<button class="btn" data-go="move"${off}>Move</button>`;
    for (const [kind, words] of Object.entries(SETTLE))
      if (s.commands.includes(kind)) html += `<button class="btn" data-go="settle:${kind}"${off}>${words.button}</button>`;
    if (s.commands.includes("form_settlers")) html += `<button class="btn" data-go="settlers"${off}>Form settlers</button>`;
    if (s.order) html += `<button class="btn" data-cancel${off}>Cancel order (${orderText(s.order)})</button>`;
    if (!canOrder()) html += `<p>Orders can't be given while the turn is resolving.</p>`;
  } else if (page.startsWith("settle:")) {
    const kind = page.slice(7), f = s[kind], title = s.order?.type === kind ? s.order.title : f.title;
    html += `<p>${SETTLE[kind].ask}</p>
      <label>Your title <input id="settleTitle" maxlength="${f.max_length}" spellcheck="false" value="${esc(title)}"></label>
      ${f.ok ? "" : `<p class="why">${esc(f.why)}</p>`}
      <button class="btn" data-settle="${kind}"${f.ok ? off : " disabled"}>${SETTLE[kind].confirm}</button>`;
  } else if (page === "settlers") {
    const f = s.form_settlers, n = s.order?.type === "form_settlers" ? s.order.people : f.min;
    html += `<p>Form settlers? A party will set out from here under a Pioneer, to settle new land, taking young and old alike.</p>
      <label>How many people (of ${s.people.toLocaleString()}) <input id="settlersCount" type="number" min="${f.min}" max="${f.max}" step="1" value="${n}"${f.ok ? "" : " disabled"}></label>
      ${f.ok ? `<p class="why">From ${f.min.toLocaleString()} to ${f.max.toLocaleString()}.</p>` : `<p class="why">${esc(f.why)}</p>`}
      <button class="btn" data-settlers${f.ok ? off : " disabled"}>Form the settlers</button>`;
  } else if (page === "move") {
    const ok = Object.fromEntries(s.moves.map(mv => [mv.direction, mv.ok]));
    const cell = d => `<button class="btn${s.order?.direction === d ? " on" : ""}" data-move="${d}"${ok[d] ? "" : " disabled"}>${DIR_LABEL[d]}</button>`;
    html += `<p>Which way?</p><div class="compass">${cell("nw")}${cell("n")}${cell("ne")}${cell("w")}<span class="here">·</span>${cell("e")}${cell("sw")}${cell("s")}${cell("se")}</div>`;
  }
  if (page !== "orders") html += `<button class="btn" data-go="orders">Back</button>`;
  m.innerHTML = html;
  m.hidden = false;
  const a = menuAnchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  let left = a.right + 6, top = a.top;
  if (left + w > innerWidth - 8) left = Math.max(8, a.left - w - 6);
  if (left < 8 || innerWidth < 640) { left = Math.max(8, Math.min(a.left, innerWidth - w - 8)); top = a.top - h - 6; }
  m.style.left = `${left}px`;
  m.style.top = `${Math.max(8, Math.min(top, innerHeight - h - 8))}px`;
  if (page.startsWith("settle:")) $("settleTitle").select();
  if (page === "settlers" && !$("settlersCount").disabled) $("settlersCount").select();
}
$("menu").addEventListener("click", async e => {
  const go = e.target.closest("[data-go]"), mv = e.target.closest("[data-move]"), cancel = e.target.closest("[data-cancel]");
  if (go) return showMenu(go.dataset.go);
  const settle = e.target.closest("[data-settle]");
  if (settle) return settleHere(settle.dataset.settle);
  if (e.target.closest("[data-settlers]")) return formSettlers();
  if (mv || cancel) {
    const s = menuFor;
    closeMenu();
    await giveOrder(s, mv ? mv.dataset.move : null);
  }
});
async function giveOrder(s, direction, extra = {}) {   // direction null takes the order back
  try {
    await api(`/api/nation/${nationId}/orders`, { turn: VIEW.turn, leader: s.leader, direction, ...extra });
    say("");   // the orders box shows it
    return true;
  } catch (err) {
    say(err.message);
    return false;
  } finally {
    await loadView(false);
  }
}
async function settleHere(kind) {
  const s = menuFor, title = $("settleTitle").value.trim() || s[kind].title;
  closeMenu();
  await giveOrder(s, null, { [kind]: title });
}
async function formSettlers() {
  const s = menuFor, f = s.form_settlers, n = Math.round(+$("settlersCount").value);
  if (!(n >= f.min && n <= f.max)) { say(`The party must be from ${f.min} to ${f.max} people.`); return; }
  closeMenu();
  await giveOrder(s, null, { form_settlers: n });
}
$("menu").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const settle = $("menu").querySelector("[data-settle]"), settlers = $("menu").querySelector("[data-settlers]");
  if (e.target.id === "settleTitle" && !settle.disabled) settleHere(settle.dataset.settle);
  if (e.target.id === "settlersCount" && !settlers.disabled) formSettlers();
});
document.addEventListener("pointerdown", e => {
  if (!$("menu").hidden && !e.target.closest("#menu") && !e.target.closest("#segments")) closeMenu();
});
window.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

// ---------- turns ----------
let status = { turn: null, phase: null }, committing = false;
function say(text) { $("msg").textContent = text; }
function renderStatus() {
  $("turnLine").textContent = status.turn == null ? "" : `Turn ${status.turn}`;
  const busy = committing || status.phase !== "orders";
  $("commit").disabled = busy || !VIEW;
  // A play symbol; an hourglass while the year passes.
  const label = busy && status.turn != null ? "The year passes…" : "Commit Turn";
  if ($("commit").title !== label || !$("commit").firstChild) {
    $("commit").innerHTML = glyph(busy && status.turn != null ? "wait" : "play", label);
    $("commit").title = label;
    $("commit").setAttribute("aria-label", label);
  }
  if (VIEW) renderOrders();   // the crosses follow whether orders can be given
}
async function pollStatus() {
  try {
    const st = await api("/api/status");
    const changed = st.turn !== status.turn;
    status = st;
    if (changed && VIEW && st.turn !== VIEW.turn && st.phase === "orders" && !committing) {
      closeMenu();
      await loadView(true);
    }
  } catch { /* the server is restarting; try again shortly */ }
  renderStatus();
}
$("commit").addEventListener("click", async () => {
  committing = true;
  closeMenu();
  renderStatus();
  say("");
  try {
    const r = await api("/api/commit", { turn: VIEW.turn });
    status = { ...status, turn: r.turn, phase: r.phase };
  } catch (e) {
    say(e.message);
  }
  committing = false;
  await loadView(true);
  await pollStatus();
});

async function startGame() {
  try {
    await initMap();
    status = await api("/api/status");
    await loadView(true);
    const c = VIEW.home ? tileCentre(VIEW.home) : null;
    if (c) { cam.lat = c.lat; cam.lon = c.lon; cam.goal = null; }
    if (!selected && VIEW.home) selectTile(VIEW.home);
  } catch (e) {
    say(e.message);
  }
  setInterval(pollStatus, 2000);
}
</script>
</body>
</html>
